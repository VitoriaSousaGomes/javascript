<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Sistema de verificação de Nacionalidade</h1>
    Você vive em qual país? <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Enviar" onclick="verificar()">
    <div id="res">

    </div>

    <script>
        function verificar() {
            var txtpais = window.document.querySelector('input#txtpais')
            var res = window.document.querySelector('div#res')
            var pais = txtpais.value
            res.innerHTML = `Você está vivendo em ${pais}`

            if (pais == 'Brasil') {
                res.innerHTML += `<p>Então você é <strong>Brasileiro</strong></p>`
            } else {
                res.innerHTML += `<p>Então você é <strong>Estrangeiro</strong></p>`
            }
        }
    </script>
</body>
</html>
